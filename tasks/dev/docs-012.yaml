# Written with scripts/author_tasks.py; see PLAN.md section 8 for the schema.
id: docs-012
version: 2
split: dev
category: docs
difficulty: medium
prompt: The customer has sent back the unused Rattan Cushion Cover from order 9673 because they changed
  their mind. Please process their refund.
policy:
- refund-policy
checks:
  answer:
    numeric:
      value: 32.99
      tolerance: 0.01
    grounded: true
  state:
    expect_rows:
    - table: refunds
      match:
        order_id: 9673
        amount: 32.99
        reason:
          contains_any:
          - mind
          - unused
          - return
          - no longer want
          - unwanted
oracle:
  calls:
  - tool: get_order
    args:
      order_id: 9673
  - tool: search_docs
    args:
      query: change of mind return refund
  - tool: issue_refund
    args:
      order_id: 9673
      amount: 32.99
      reason: change_of_mind
  final_answer: 'I refunded $32.99 for the Rattan Cushion Cover on order 9673 (reason: change_of_mind).'
