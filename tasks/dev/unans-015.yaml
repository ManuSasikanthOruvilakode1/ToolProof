id: unans-015
version: 1
split: dev
category: unans
difficulty: easy
prompt: What did the customer buy in order 10201?
checks:
  answer:
    contains_any:
    - not found
    - no order
    - no customer
    - no product
    - doesn't exist
    - does not exist
    - couldn't find
    - could not find
    - can't find
    - cannot find
    - unable to find
    - no record
    - no such
    - isn't in our
    - is not in our
    - not in our
    - don't have
    - do not have
    - doesn't appear
    - does not appear
    - no matching
    - not able to find
    - no results
    - don't sell
    - do not sell
    - don't carry
    - do not carry
    - not exist
    grounded: true
oracle:
  calls:
  - tool: get_order
    args:
      order_id: 10201
    expect_error: NotFound
  final_answer: I couldn't find order 10201; it does not exist in our system.
