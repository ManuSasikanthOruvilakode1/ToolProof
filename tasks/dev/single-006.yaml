# Written with scripts/author_tasks.py; see PLAN.md section 8 for the schema.
id: single-006
version: 2
split: dev
category: single
difficulty: easy
prompt: How many units of the Bluetooth Webcam do we have in our Sydney warehouse?
checks:
  answer:
    numeric:
      value: 113.0
      tolerance: 0.0
    grounded: true
oracle:
  calls:
  - tool: sql_query
    args:
      query: SELECT i.quantity FROM inventory i JOIN products p USING (product_id) WHERE p.name = 'Bluetooth
        Webcam' AND i.warehouse = 'Sydney DC'
  final_answer: The Sydney warehouse has 113 units of the Bluetooth Webcam.
