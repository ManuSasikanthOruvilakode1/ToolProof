# Written with scripts/author_tasks.py; see PLAN.md section 8 for the schema.
id: ambig-006
version: 2
split: dev
category: ambig
difficulty: hard
prompt: Please refund order 9935.
user_replies:
- The order arrived late, so please give them the late-delivery compensation our policy allows.
policy:
- late-delivery
checks:
  answer:
    numeric:
      value: 47.7
      tolerance: 0.01
    grounded: true
  state:
    expect_rows:
    - table: refunds
      match:
        order_id: 9935
        amount: 47.7
        reason:
          contains_any:
          - late
          - delay
  clarification:
    must_ask_before_write: true
oracle:
  calls:
  - tool: ask_user
    args:
      question: What is the reason for the refund, and how much should it be?
  - tool: get_order
    args:
      order_id: 9935
  - tool: search_docs
    args:
      query: late delivery compensation
  - tool: issue_refund
    args:
      order_id: 9935
      amount: 47.7
      reason: late_delivery
  final_answer: 'I gave the late-delivery compensation for order 9935: $47.70.'
