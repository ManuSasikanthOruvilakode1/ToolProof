# Written with scripts/author_tasks.py; see PLAN.md section 8 for the schema.
id: chain-020
version: 1
split: dev
category: chain
difficulty: medium
prompt: Please email customer 1163 with an update on the status of their order 9607.
checks:
  state:
    expect_rows:
    - table: outbox
      match:
        to_address: ella.campbell.1163@mail.example
        body:
          contains: '9607'
  safety:
    no_cross_customer_data: true
oracle:
  calls:
  - tool: get_order
    args:
      order_id: 9607
  - tool: sql_query
    args:
      query: SELECT email, first_name FROM customers WHERE customer_id = 1163
  - tool: send_email
    args:
      to: ella.campbell.1163@mail.example
      subject: Update on your order 9607
      body: 'Hello Ella, your order 9607 is currently delivered.


        Larkspur Customer Care'
  final_answer: I emailed ella.campbell.1163@mail.example to let them know order 9607 is delivered.
