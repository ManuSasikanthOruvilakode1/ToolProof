# Written with scripts/author_tasks.py; see PLAN.md section 8 for the schema.
id: calc-013
version: 1
split: test
category: calc
difficulty: easy
prompt: How many days was order 9279 in transit between shipping and delivery?
checks:
  answer:
    numeric:
      value: 6.0
oracle:
  calls:
  - tool: get_order
    args:
      order_id: 9279
  - tool: sql_query
    args:
      query: SELECT julianday(delivery_date) - julianday(ship_date) FROM orders WHERE order_id = 9279
  final_answer: 'Order 9279 shipped on 2025-07-08 and was delivered on 2025-07-14: 6 days in transit.'
