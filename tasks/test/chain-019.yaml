# Written with scripts/author_tasks.py; see PLAN.md section 8 for the schema.
id: chain-019
version: 1
split: test
category: chain
difficulty: medium
prompt: Customer 1225 is asking about their most recent order. What's its status, when did it ship, and
  which email address should I reply to?
checks:
  answer:
    contains_all:
    - '10037'
    - delivered
    - '2026-03-12'
    - benjamin.chen.1225@mail.example
    grounded: true
oracle:
  calls:
  - tool: sql_query
    args:
      query: SELECT order_id FROM orders WHERE customer_id = 1225 ORDER BY order_date DESC LIMIT 1
  - tool: get_order
    args:
      order_id: 10037
  - tool: sql_query
    args:
      query: SELECT email FROM customers WHERE customer_id = 1225
  final_answer: Their most recent order is 10037. It is delivered and shipped on 2026-03-12. Reply to
    benjamin.chen.1225@mail.example.
