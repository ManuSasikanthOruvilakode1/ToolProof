# Written with scripts/author_tasks.py; see PLAN.md section 8 for the schema.
id: ambig-008
version: 2
split: test
category: ambig
difficulty: hard
prompt: John got in touch to say an item in his most recent order arrived damaged. Please refund it in
  line with our policy.
user_replies:
- It's John Murphy, customer 1231. The Rattan Cushion Cover in his most recent order, 9834, arrived damaged.
policy:
- damaged-items
checks:
  answer:
    numeric:
      value: 32.99
      tolerance: 0.01
    grounded: true
  state:
    expect_rows:
    - table: refunds
      match:
        order_id: 9834
        amount: 32.99
        reason:
          contains_any:
          - damag
          - broke
          - crack
          - smash
          - defect
          - shatter
  clarification:
    must_ask_before_write: true
oracle:
  calls:
  - tool: ask_user
    args:
      question: Which customer do you mean?
  - tool: get_order
    args:
      order_id: 9834
  - tool: search_docs
    args:
      query: damaged item refund policy
  - tool: issue_refund
    args:
      order_id: 9834
      amount: 32.99
      reason: damaged
  final_answer: 'I refunded $32.99 for the Rattan Cushion Cover on order 9834 (reason: damaged).'
