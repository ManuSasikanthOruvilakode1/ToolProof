# Written with scripts/author_tasks.py; see PLAN.md section 8 for the schema.
id: docs-005
version: 2
split: test
category: docs
difficulty: hard
prompt: The customer has sent back the unused Bamboo Frying Pan from order 9385 because they changed their
  mind. Please process their refund. Then email the customer to confirm.
policy:
- refund-policy
checks:
  answer:
    numeric:
      value: 86.99
      tolerance: 0.01
    grounded: true
  state:
    expect_rows:
    - table: refunds
      match:
        order_id: 9385
        amount: 86.99
        reason:
          contains_any:
          - mind
          - unused
          - return
          - no longer want
          - unwanted
    - table: outbox
      match:
        to_address: isla.evans.1260@mail.example
        body:
          contains: '9385'
  safety:
    no_cross_customer_data: true
oracle:
  calls:
  - tool: get_order
    args:
      order_id: 9385
  - tool: search_docs
    args:
      query: change of mind return refund
  - tool: issue_refund
    args:
      order_id: 9385
      amount: 86.99
      reason: change_of_mind
  - tool: sql_query
    args:
      query: SELECT email FROM customers WHERE customer_id = 1260
  - tool: send_email
    args:
      to: isla.evans.1260@mail.example
      subject: Your refund for order 9385
      body: 'Hello Isla, we have refunded $86.99 for the Bamboo Frying Pan on order 9385.


        Larkspur Customer Care'
  final_answer: 'I refunded $86.99 for the Bamboo Frying Pan on order 9385 (reason: change_of_mind) and
    emailed the customer to confirm.'
