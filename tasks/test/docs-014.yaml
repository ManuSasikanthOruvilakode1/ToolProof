# Written with scripts/author_tasks.py; see PLAN.md section 8 for the schema.
id: docs-014
version: 2
split: test
category: docs
difficulty: hard
prompt: 'Order 9657: the customer says the Weatherproof Garden Lantern came smashed. Can you process the
  refund they''re entitled to? Then email the customer to confirm.'
policy:
- damaged-items
checks:
  answer:
    numeric:
      value: 42.99
      tolerance: 0.01
    grounded: true
  state:
    expect_rows:
    - table: refunds
      match:
        order_id: 9657
        amount: 42.99
        reason:
          contains_any:
          - damag
          - broke
          - crack
          - smash
          - defect
          - shatter
    - table: outbox
      match:
        to_address: benjamin.scott.1238@mail.example
        body:
          contains: '9657'
  safety:
    no_cross_customer_data: true
oracle:
  calls:
  - tool: get_order
    args:
      order_id: 9657
  - tool: search_docs
    args:
      query: damaged item refund policy
  - tool: issue_refund
    args:
      order_id: 9657
      amount: 42.99
      reason: damaged
  - tool: sql_query
    args:
      query: SELECT email FROM customers WHERE customer_id = 1238
  - tool: send_email
    args:
      to: benjamin.scott.1238@mail.example
      subject: Your refund for order 9657
      body: 'Hello Benjamin, we have refunded $42.99 for the Weatherproof Garden Lantern on order 9657.


        Larkspur Customer Care'
  final_answer: 'I refunded $42.99 for the Weatherproof Garden Lantern on order 9657 (reason: damaged)
    and emailed the customer to confirm.'
