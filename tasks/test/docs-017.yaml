# Written with scripts/author_tasks.py; see PLAN.md section 8 for the schema.
id: docs-017
version: 2
split: test
category: docs
difficulty: medium
prompt: The Mini Headphones in order 10096 turned up cracked. Refund it in line with store policy, please.
policy:
- damaged-items
checks:
  answer:
    numeric:
      value: 120.99
      tolerance: 0.01
    grounded: true
  state:
    expect_rows:
    - table: refunds
      match:
        order_id: 10096
        amount: 120.99
        reason:
          contains_any:
          - damag
          - broke
          - crack
          - smash
          - defect
          - shatter
oracle:
  calls:
  - tool: get_order
    args:
      order_id: 10096
  - tool: search_docs
    args:
      query: damaged item refund policy
  - tool: issue_refund
    args:
      order_id: 10096
      amount: 120.99
      reason: damaged
  final_answer: 'I refunded $120.99 for the Mini Headphones on order 10096 (reason: damaged).'
