name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Process log integrity
        run: uv run python scripts/devlog.py verify

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Benchmark validation (schema, counts, difficulty rules)
        run: uv run toolproof bench validate --strict-counts

      - name: Benchmark oracle (every task's reference solution passes)
        run: uv run toolproof bench oracle

      - name: Tests
        run: uv run pytest -q
